<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>부자 원팀 데일리 미션 상황판</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK (v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap');
    body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03); }
    .custom-check {
      appearance: none;
      width: 26px;
      height: 26px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .custom-check:checked {
      background-color: #3b82f6;
      border-color: #3b82f6;
      background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
    }
    .custom-check.son-check:checked {
      background-color: #10b981;
      border-color: #10b981;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-16">

  <!-- 상단 네비게이션 & 실시간 연결 상태 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 py-3 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">⚽️</span>
        <div>
          <h1 class="text-lg font-black text-slate-900 tracking-tight leading-none">부자 원팀 상황판</h1>
          <div class="flex items-center space-x-1.5 mt-1">
            <span id="syncDot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="syncStatus" class="text-[11px] font-medium text-emerald-600">실시간 동기화 중</span>
          </div>
        </div>
      </div>
      <!-- 날짜 선택 및 이동 -->
      <div class="flex items-center space-x-1 bg-slate-100 p-1 rounded-xl">
        <button onclick="changeDate(-1)" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white text-slate-600 transition"><i class="fa-solid fa-chevron-left text-xs"></i></button>
        <button onclick="goToToday()" id="dateDisplay" class="px-2 text-xs font-bold text-slate-700 hover:text-blue-600 transition">오늘</button>
        <button onclick="changeDate(1)" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white text-slate-600 transition"><i class="fa-solid fa-chevron-right text-xs"></i></button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-5 space-y-5">

    <!-- 원팀 승리 종합 게이지 카드 -->
    <div class="bg-white rounded-3xl p-5 card-shadow border border-slate-100">
      <div class="flex items-center justify-between mb-4">
        <div>
          <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-0.5">TEAM ONE PROGRESS</div>
          <div class="text-2xl font-black text-slate-900 flex items-center gap-2">
            <span>오늘의 원팀 달성</span>
            <span id="winBadge" class="text-xs px-2.5 py-1 rounded-full bg-slate-100 text-slate-600 font-bold">진행 중</span>
          </div>
        </div>
        <div class="text-right">
          <div class="text-xs font-bold text-slate-400">합산 달성률</div>
          <div id="teamPercent" class="text-2xl font-black text-blue-600">0%</div>
        </div>
      </div>

      <!-- 게이지 바 -->
      <div class="relative w-full bg-slate-100 rounded-full h-4 overflow-hidden mb-2">
        <div id="teamProgressBar" class="h-full bg-gradient-to-r from-emerald-400 to-blue-500 rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>
      <div class="flex justify-between items-center text-xs font-bold text-slate-500">
        <span class="text-slate-400 font-medium">두 사람의 목표를 합산하여 계산됩니다.</span>
        <span class="text-blue-600 font-semibold"><i class="fa-solid fa-trophy mr-1"></i>75% 이상 달성 시 원팀 승리!</span>
      </div>
    </div>

    <!-- 주간 스트릭 요약 바 -->
    <div class="bg-white rounded-2xl p-4 card-shadow border border-slate-100 flex items-center justify-between">
      <div class="text-xs font-bold text-slate-500 flex items-center gap-1.5">
        <i class="fa-solid fa-fire text-orange-500"></i>
        <span>이번 주 승리 기록</span>
      </div>
      <div class="flex space-x-2" id="weeklyStreakContainer"></div>
    </div>

    <!-- 2단 미션 카드 영역 (의현 & 아빠 개별 회복모드 탑재) -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

      <!-- 의현 미션 카드 -->
      <div class="bg-white rounded-3xl p-5 card-shadow border border-emerald-100/60 flex flex-col justify-between">
        <div>
          <!-- 상단 프로필 및 개별 회복 스위치 -->
          <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-100 gap-2">
            <div class="flex items-center space-x-2.5">
              <div class="w-10 h-10 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center font-black text-lg flex-shrink-0">
                의
              </div>
              <div>
                <h2 class="text-base font-black text-slate-900 leading-tight">의현 (U11)</h2>
                <div class="text-[11px] text-emerald-600 font-bold" id="sonProgressLabel">0 / 0 완료</div>
              </div>
            </div>

            <!-- 의현 전용 회복 스위치 & 미션 추가 버튼 -->
            <div class="flex items-center space-x-2">
              <label class="flex items-center cursor-pointer select-none bg-amber-50/80 border border-amber-200/60 px-2.5 py-1.5 rounded-xl transition hover:bg-amber-100/60">
                <input type="checkbox" id="sonRecoveryToggle" onchange="toggleIndividualRecovery('son')" class="sr-only peer">
                <div class="w-7 h-4 bg-slate-200 peer-checked:bg-amber-500 rounded-full relative transition duration-200 ease-in-out mr-1.5">
                  <div class="absolute left-0.5 top-0.5 bg-white w-3 h-3 rounded-full transition transform peer-checked:translate-x-3 shadow-xs"></div>
                </div>
                <span class="text-[11px] font-bold text-amber-900 flex items-center gap-1">
                  <i class="fa-solid fa-battery-half text-amber-500 text-[10px]"></i>
                  회복
                </span>
              </label>

              <button onclick="openMissionModal('son')" class="text-xs font-bold w-7 h-7 rounded-xl bg-emerald-50 text-emerald-700 hover:bg-emerald-100 transition flex items-center justify-center">
                <i class="fa-solid fa-plus text-xs"></i>
              </button>
            </div>
          </div>

          <!-- 미션 목록 -->
          <div id="sonMissionList" class="space-y-2.5 my-2"></div>
        </div>
      </div>

      <!-- 아빠 미션 카드 -->
      <div class="bg-white rounded-3xl p-5 card-shadow border border-blue-100/60 flex flex-col justify-between">
        <div>
          <!-- 상단 프로필 및 개별 회복 스위치 -->
          <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-100 gap-2">
            <div class="flex items-center space-x-2.5">
              <div class="w-10 h-10 rounded-2xl bg-blue-100 text-blue-600 flex items-center justify-center font-black text-lg flex-shrink-0">
                빠
              </div>
              <div>
                <h2 class="text-base font-black text-slate-900 leading-tight">아빠 (러닝메이트)</h2>
                <div class="text-[11px] text-blue-600 font-bold" id="dadProgressLabel">0 / 0 완료</div>
              </div>
            </div>

            <!-- 아빠 전용 회복 스위치 & 미션 추가 버튼 -->
            <div class="flex items-center space-x-2">
              <label class="flex items-center cursor-pointer select-none bg-amber-50/80 border border-amber-200/60 px-2.5 py-1.5 rounded-xl transition hover:bg-amber-100/60">
                <input type="checkbox" id="dadRecoveryToggle" onchange="toggleIndividualRecovery('dad')" class="sr-only peer">
                <div class="w-7 h-4 bg-slate-200 peer-checked:bg-amber-500 rounded-full relative transition duration-200 ease-in-out mr-1.5">
                  <div class="absolute left-0.5 top-0.5 bg-white w-3 h-3 rounded-full transition transform peer-checked:translate-x-3 shadow-xs"></div>
                </div>
                <span class="text-[11px] font-bold text-amber-900 flex items-center gap-1">
                  <i class="fa-solid fa-battery-half text-amber-500 text-[10px]"></i>
                  회복
                </span>
              </label>

              <button onclick="openMissionModal('dad')" class="text-xs font-bold w-7 h-7 rounded-xl bg-blue-50 text-blue-700 hover:bg-blue-100 transition flex items-center justify-center">
                <i class="fa-solid fa-plus text-xs"></i>
              </button>
            </div>
          </div>

          <!-- 미션 목록 -->
          <div id="dadMissionList" class="space-y-2.5 my-2"></div>
        </div>
      </div>

    </div>
  </main>

  <!-- 미션 추가/수정 모달 -->
  <div id="missionModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between">
        <h3 id="modalTitle" class="text-base font-black text-slate-900">미션 추가</h3>
        <button onclick="closeMissionModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">미션 이름</label>
          <input type="text" id="modalMissionTitle" placeholder="예: 양발 리프팅 300개" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">일반 목표 기준</label>
          <input type="text" id="modalMissionTarget" placeholder="예: 20분 집중 훈련" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-amber-600 mb-1">지친 날 (회복 모드) 기준</label>
          <input type="text" id="modalMissionRecovery" placeholder="예: 10분 가볍게" class="w-full px-3.5 py-2.5 rounded-xl border border-amber-200 bg-amber-50/40 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
        </div>
      </div>

      <div class="flex space-x-2 pt-2">
        <button onclick="closeMissionModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold text-xs hover:bg-slate-200 transition">취소</button>
        <button onclick="saveMission()" class="flex-1 py-2.5 rounded-xl bg-blue-600 text-white font-bold text-xs hover:bg-blue-700 transition">저장하기</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // ⭐️ Firebase 구성 정보 (Firebase 콘솔 톱니바퀴에서 복사한 키 값으로 유지)
    // =========================================================================
    const firebaseConfig = {
       apiKey: "AIzaSyAKKmlGxJcDRzqp7VVF6RiV0OXZi-JU1tU",
       authDomain: "team-mission-6fdc1.firebaseapp.com",
       projectId: "team-mission-6fdc1",
       storageBucket: "team-mission-6fdc1.firebasestorage.app",
       messagingSenderId: "940516468423",
       appId: "1:940516468423:web:6f8b15c827473ff24000e2"
    };

    let db = null;
    let isFirebaseReady = false;

    // Firebase 초기화 검사
    if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
      try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        isFirebaseReady = true;
      } catch (err) {
        console.warn("Firebase 초기화 에러, 로컬 저장소 모드로 작동합니다:", err);
      }
    }

    // 기본 초기 미션 구성
    const defaultMissions = {
      son: [
        { id: "s1", title: "스피드 줄넘기", target: "800회 달성", recovery: "300회 가볍게" },
        { id: "s2", title: "코어 플랭크", target: "1분 30초 x 3세트", recovery: "1분 1회 유지" },
        { id: "s3", title: "콘 드리블 & 볼터치", target: "20분 집중 훈련", recovery: "10분 양발 터치" },
        { id: "s4", title: "하체 폼롤러 스트레칭", target: "10분 전신 이완", recovery: "5분 이완" }
      ],
      dad: [
        { id: "d1", title: "영어 뉴스 리스닝", target: "20분 청취 (출퇴근/자투리)", recovery: "10분 가볍게" },
        { id: "d2", title: "모빌리티 스트레칭", target: "15분 전신 스트레칭", recovery: "7분 관절 풀기" },
        { id: "d3", title: "이지 & 슬로우 러닝", target: "30분 ~ 5km 러닝", recovery: "15분 산책/조깅" },
        { id: "d4", title: "하루 한 줄 피드백", target: "오늘의 이슈/러닝 기록 1줄", recovery: "단어 1개 메모" }
      ]
    };

    // 상태 관리
    let currentDate = new Date();
    let currentMissions = JSON.parse(JSON.stringify(defaultMissions));
    // { 'YYYY-MM-DD': { checks: { s1: true, ... }, sonRecovery: false, dadRecovery: false } }
    let dailyRecords = {}; 

    let modalContext = { mode: 'create', person: 'son', missionId: null };

    function formatDate(d) {
      return d.toISOString().split('T')[0];
    }

    function getDateKey() {
      return formatDate(currentDate);
    }

    // =========================================================================
    // 실시간 동기화 (Firestore Listeners)
    // =========================================================================
    function setupRealtimeListeners() {
      const syncDot = document.getElementById('syncDot');
      const syncStatus = document.getElementById('syncStatus');

      if (!isFirebaseReady) {
        syncDot.className = "w-2 h-2 rounded-full bg-amber-500";
        syncStatus.className = "text-[11px] font-medium text-amber-600";
        syncStatus.textContent = "로컬 모드 (Firebase 키 설정 필요)";
        loadLocalFallback();
        renderAll();
        return;
      }

      // 1. 미션 목록 정의 실시간 수신
      db.collection('team_settings').doc('missions').onSnapshot((doc) => {
        if (doc.exists && doc.data().missions) {
          currentMissions = doc.data().missions;
        } else {
          db.collection('team_settings').doc('missions').set({ missions: defaultMissions });
        }
        renderAll();
      }, (err) => console.error("미션 동기화 실패:", err));

      // 2. 일일 체크 및 회복 모드 상태 실시간 수신
      db.collection('team_daily_records').onSnapshot((querySnapshot) => {
        dailyRecords = {};
        querySnapshot.forEach((doc) => {
          dailyRecords[doc.id] = doc.data();
        });
        syncDot.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
        syncStatus.className = "text-[11px] font-medium text-emerald-600";
        syncStatus.textContent = "실시간 동기화 중";
        renderAll();
      }, (err) => {
        console.error("일일 기록 동기화 실패:", err);
      });
    }

    // 로컬 폴백
    function loadLocalFallback() {
      const savedMissions = localStorage.getItem('team_missions');
      if (savedMissions) currentMissions = JSON.parse(savedMissions);
      const savedRecords = localStorage.getItem('team_daily_records');
      if (savedRecords) dailyRecords = JSON.parse(savedRecords);
    }

    function saveLocalFallback() {
      localStorage.setItem('team_missions', JSON.stringify(currentMissions));
      localStorage.setItem('team_daily_records', JSON.stringify(dailyRecords));
    }

    // =========================================================================
    // 데이터 변경 및 Firebase 쓰기
    // =========================================================================
    async function toggleCheck(id) {
      playTinkSound();
      const dateKey = getDateKey();
      if (!dailyRecords[dateKey]) {
        dailyRecords[dateKey] = { checks: {}, sonRecovery: false, dadRecovery: false };
      }
      if (!dailyRecords[dateKey].checks) {
        dailyRecords[dateKey].checks = {};
      }

      dailyRecords[dateKey].checks[id] = !dailyRecords[dateKey].checks[id];

      renderAll();

      if (isFirebaseReady) {
        await db.collection('team_daily_records').doc(dateKey).set(dailyRecords[dateKey], { merge: true });
      } else {
        saveLocalFallback();
      }

      checkCelebration();
    }

    // 개별 회복 모드 토글 (son 또는 dad)
    async function toggleIndividualRecovery(person) {
      const dateKey = getDateKey();
      if (!dailyRecords[dateKey]) {
        dailyRecords[dateKey] = { checks: {}, sonRecovery: false, dadRecovery: false };
      }
      
      const isChecked = document.getElementById(`${person}RecoveryToggle`).checked;
      if (person === 'son') {
        dailyRecords[dateKey].sonRecovery = isChecked;
      } else {
        dailyRecords[dateKey].dadRecovery = isChecked;
      }

      renderAll();

      if (isFirebaseReady) {
        await db.collection('team_daily_records').doc(dateKey).set(dailyRecords[dateKey], { merge: true });
      } else {
        saveLocalFallback();
      }
    }

    async function updateMissionsInCloud() {
      if (isFirebaseReady) {
        await db.collection('team_settings').doc('missions').set({ missions: currentMissions });
      } else {
        saveLocalFallback();
        renderAll();
      }
    }

    // =========================================================================
    // 화면 렌더링
    // =========================================================================
    function renderAll() {
      renderDateHeader();
      renderMissions();
      renderProgressAndBadges();
      renderWeeklyStreak();
    }

    function renderDateHeader() {
      const d = currentDate;
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const isToday = formatDate(d) === formatDate(new Date());
      const label = isToday ? `오늘 (${d.getMonth()+1}.${d.getDate()} ${days[d.getDay()]})` : `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
      document.getElementById('dateDisplay').textContent = label;

      const dateKey = getDateKey();
      const currentDay = dailyRecords[dateKey] || {};
      document.getElementById('sonRecoveryToggle').checked = !!currentDay.sonRecovery;
      document.getElementById('dadRecoveryToggle').checked = !!currentDay.dadRecovery;
    }

    function renderMissions() {
      const dateKey = getDateKey();
      const currentDay = dailyRecords[dateKey] || { checks: {} };
      const checks = currentDay.checks || {};

      ['son', 'dad'].forEach(person => {
        const listEl = document.getElementById(`${person}MissionList`);
        listEl.innerHTML = '';
        const missions = currentMissions[person] || [];
        const isRecovery = person === 'son' ? !!currentDay.sonRecovery : !!currentDay.dadRecovery;

        missions.forEach(m => {
          const isChecked = !!checks[m.id];
          const targetText = (isRecovery && m.recovery) ? m.recovery : m.target;
          const checkClass = person === 'son' ? 'son-check' : '';

          const item = document.createElement('div');
          item.className = `group flex items-center justify-between p-3 rounded-2xl border transition-all ${
            isChecked ? 'bg-slate-50/80 border-slate-200' : 'bg-white border-slate-100 hover:border-slate-200'
          }`;

          item.innerHTML = `
            <div class="flex items-center space-x-3 flex-1 min-w-0 pr-2">
              <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleCheck('${m.id}')" class="custom-check ${checkClass} flex-shrink-0">
              <div class="truncate cursor-pointer" onclick="toggleCheck('${m.id}')">
                <div class="text-sm font-bold ${isChecked ? 'line-through text-slate-400' : 'text-slate-800'} truncate">${m.title}</div>
                <div class="text-xs font-semibold ${isChecked ? 'text-slate-400' : isRecovery ? 'text-amber-600 font-bold' : 'text-slate-400'} flex items-center gap-1">
                  ${isRecovery ? '<i class="fa-solid fa-battery-half text-[10px]"></i>' : ''}
                  ${targetText}
                </div>
              </div>
            </div>
            <div class="flex items-center space-x-1 opacity-60 group-hover:opacity-100 transition">
              <button onclick="openEditModal('${person}', '${m.id}')" class="w-7 h-7 text-slate-400 hover:text-blue-600 flex items-center justify-center rounded-lg hover:bg-slate-100"><i class="fa-solid fa-pencil text-xs"></i></button>
              <button onclick="deleteMission('${person}', '${m.id}')" class="w-7 h-7 text-slate-400 hover:text-red-500 flex items-center justify-center rounded-lg hover:bg-slate-100"><i class="fa-solid fa-trash-can text-xs"></i></button>
            </div>
          `;
          listEl.appendChild(item);
        });
      });
    }

    function renderProgressAndBadges() {
      const dateKey = getDateKey();
      const currentDay = dailyRecords[dateKey] || { checks: {} };
      const checks = currentDay.checks || {};

      let totalCount = 0;
      let completedCount = 0;

      ['son', 'dad'].forEach(person => {
        const missions = currentMissions[person] || [];
        const personTotal = missions.length;
        const personCompleted = missions.filter(m => checks[m.id]).length;
        document.getElementById(`${person}ProgressLabel`).textContent = `${personCompleted} / ${personTotal} 완료`;
        totalCount += personTotal;
        completedCount += personCompleted;
      });

      const percent = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;
      document.getElementById('teamProgressBar').style.width = `${percent}%`;
      document.getElementById('teamPercent').textContent = `${percent}%`;

      const badge = document.getElementById('winBadge');
      if (percent >= 75) {
        badge.className = "text-xs px-2.5 py-1 rounded-full bg-emerald-500 text-white font-black animate-bounce";
        badge.textContent = "⭐️ 원팀 승리 달성!";
      } else {
        badge.className = "text-xs px-2.5 py-1 rounded-full bg-slate-100 text-slate-600 font-bold";
        badge.textContent = `승리까지 ${Math.max(0, Math.ceil(totalCount * 0.75) - completedCount)}개 남음`;
      }
    }

    function renderWeeklyStreak() {
      const container = document.getElementById('weeklyStreakContainer');
      container.innerHTML = '';
      const days = ['월', '화', '수', '목', '금', '토', '일'];

      const temp = new Date(currentDate);
      const day = temp.getDay();
      const diff = temp.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(temp.setDate(diff));

      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const k = formatDate(d);

        const rec = dailyRecords[k];
        let won = false;
        if (rec && rec.checks) {
          const totalMissions = (currentMissions.son?.length || 0) + (currentMissions.dad?.length || 0);
          const done = Object.values(rec.checks).filter(Boolean).length;
          if (totalMissions > 0 && (done / totalMissions) >= 0.75) won = true;
        }

        const isCurrentSelected = k === getDateKey();
        const el = document.createElement('div');
        el.className = `flex flex-col items-center justify-center w-8 h-10 rounded-xl cursor-pointer transition ${
          isCurrentSelected ? 'border-2 border-blue-500 bg-blue-50/40' : 'bg-slate-50'
        }`;
        el.onclick = () => { currentDate = d; renderAll(); };
        el.innerHTML = `
          <span class="text-[10px] font-bold text-slate-400">${days[i]}</span>
          <span class="text-xs ${won ? 'text-amber-500 font-bold' : 'text-slate-300'}">${won ? '⭐️' : '•'}</span>
        `;
        container.appendChild(el);
      }
    }

    // =========================================================================
    // 모달 및 미션 편집
    // =========================================================================
    function openMissionModal(person) {
      modalContext = { mode: 'create', person, missionId: null };
      document.getElementById('modalTitle').textContent = `${person === 'son' ? '의현이' : '아빠'} 새 미션 추가`;
      document.getElementById('modalMissionTitle').value = '';
      document.getElementById('modalMissionTarget').value = '';
      document.getElementById('modalMissionRecovery').value = '';
      document.getElementById('missionModal').classList.remove('hidden');
    }

    function openEditModal(person, missionId) {
      modalContext = { mode: 'edit', person, missionId };
      const m = currentMissions[person].find(item => item.id === missionId);
      if (!m) return;
      document.getElementById('modalTitle').textContent = `미션 수정`;
      document.getElementById('modalMissionTitle').value = m.title;
      document.getElementById('modalMissionTarget').value = m.target;
      document.getElementById('modalMissionRecovery').value = m.recovery || '';
      document.getElementById('missionModal').classList.remove('hidden');
    }

    function closeMissionModal() {
      document.getElementById('missionModal').classList.add('hidden');
    }

    async function saveMission() {
      const title = document.getElementById('modalMissionTitle').value.trim();
      const target = document.getElementById('modalMissionTarget').value.trim();
      const recovery = document.getElementById('modalMissionRecovery').value.trim();
      if (!title || !target) return alert('미션 이름과 목표 기준을 입력해 주세요.');

      const { mode, person, missionId } = modalContext;
      if (mode === 'create') {
        const newId = (person === 'son' ? 's_' : 'd_') + Date.now();
        currentMissions[person].push({ id: newId, title, target, recovery });
      } else {
        const targetMission = currentMissions[person].find(item => item.id === missionId);
        if (targetMission) {
          targetMission.title = title;
          targetMission.target = target;
          targetMission.recovery = recovery;
        }
      }
      closeMissionModal();
      await updateMissionsInCloud();
    }

    async function deleteMission(person, missionId) {
      if (!confirm('이 미션을 삭제할까요?')) return;
      currentMissions[person] = currentMissions[person].filter(m => m.id !== missionId);
      await updateMissionsInCloud();
    }

    function changeDate(days) {
      currentDate.setDate(currentDate.getDate() + days);
      renderAll();
    }
    function goToToday() {
      currentDate = new Date();
      renderAll();
    }

    let audioCtx = null;
    function playTinkSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    function checkCelebration() {
      const dateKey = getDateKey();
      const currentDay = dailyRecords[dateKey] || { checks: {} };
      const totalCount = (currentMissions.son?.length || 0) + (currentMissions.dad?.length || 0);
      const completedCount = Object.values(currentDay.checks || {}).filter(Boolean).length;
      if (totalCount > 0 && (completedCount / totalCount) >= 0.75) {
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
      }
    }

    window.onload = () => {
      setupRealtimeListeners();
    };
  </script>
</body>
</html>
